services:
  - type: web
    name: college-social-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api
    # Persistent disk for uploaded photos/lectures/videos/audio (storage.service.ts falls back to
    # local disk under ./uploads when CLOUDINARY_* env vars are unset). Free-tier services can't
    # attach disks, hence "starter" above -- without this, every deploy/restart/idle-spindown would
    # wipe anything users had uploaded.
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # jsdom@30 (file converter) pulls undici@8, whose CacheStorage crashes on Node 20 with
      # "webidl.util.markAsUncloneable is not a function". Pin Node 22 -- also set via
      # .node-version and package.json "engines"; this is the explicit belt-and-braces for Render.
      - key: NODE_VERSION
        value: "22"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Everything below must be filled in on the Render dashboard (Environment tab) --
      # values are left out of this file on purpose since they're secrets / deployment-specific.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN_DAYS
        value: "30"
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Per-category upload size limits (MAX_VIDEO_SIZE_MB, MAX_LECTURE_SIZE_MB, etc.) are optional
      # -- each falls back to a built-in default suited to that content type when unset (see
      # src/upload/multer.config.ts). Add one here only to override a specific category.
      - key: COLLEGE_EMAIL_DOMAIN
        sync: false
      # smtp-relay.brevo.com:587 is Brevo's free-tier relay (see EmailService/.env.example for why
      # SMTP over a transactional-provider API) -- only the credentials below are secret/per-account.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      # Per-student AI questions allowed per calendar day (resets at local midnight).
      - key: AI_DAILY_MESSAGE_QUOTA
        value: 100
      # Cloudflare Stream (video hosting for reels). Set all three on the dashboard -> new reels
      # upload to Stream instead of Cloudinary. Unset -> reels stay on Cloudinary. The frontend
      # also needs NEXT_PUBLIC_STREAM_ENABLED=1 (see the frontend's .env.production).
      - key: CF_STREAM_ACCOUNT_ID
        sync: false
      - key: CF_STREAM_API_TOKEN
        sync: false
      - key: CF_STREAM_CUSTOMER_SUBDOMAIN
        sync: false
      # Web Push (phone notifications). Public key is safe to commit -- it's already baked into
      # the frontend build too (see .env.production there), so this MUST match that value exactly.
      # Only the private key is a real secret and needs to be pasted on the dashboard.
      - key: VAPID_PUBLIC_KEY
        value: BC7ySzBzkY79id34X7Ysw6dn1hjFge6Z7hWXInwpJsNw-_4EPmm5K6kdnAkhVaE6x0rUK5_0vyQqBqodVNxd6yY
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # محوّل الملفات (src/convert) high-accuracy engine -- Adobe PDF Services OAuth Server-to-Server
      # credentials. Optional: unset -> conversions use the local Poppler/LibreOffice/pdfkit
      # pipeline. Set both -> every conversion routes through Adobe (free tier 500 docs/month).
      - key: PDF_SERVICES_CLIENT_ID
        sync: false
      - key: PDF_SERVICES_CLIENT_SECRET
        sync: false
      # محوّل الملفات -- LlamaParse (LlamaCloud) key for PDF -> Word/PowerPoint. LLM-backed structural
      # recovery (headings, lists, tables-as-grids, Arabic/RTL in reading order); tried before Adobe
      # for pdf->docx / pdf->pptx. Optional -- unset just skips to Adobe. Free tier 1000 pages/day.
      - key: LLAMAPARSE_API_KEY
        sync: false
