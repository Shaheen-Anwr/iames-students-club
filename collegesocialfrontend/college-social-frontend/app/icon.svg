<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- IAEMS Students Club emblem ("Ascent Orbit"): students connect and revolve around a
       bright community core on an indigo-to-amber orbital ring, then rise along a linked path
       of milestones to a spark. Linked nodes = social + chat, the path = study + schedule,
       the spark = achievement + streaks. Social network first, study second.
       Single source of truth for the brand mark - keep components/ui/Logo.tsx (JSX mirror)
       and scripts/generate-pwa-icons.mjs (reads this file) in sync with any geometry change. -->
  <defs>
    <linearGradient id="ring" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#F7B733"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D2FF"/>
    </radialGradient>
    <linearGradient id="sheen" x1="4" y1="0" x2="20" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="#141520"/>
  <rect width="48" height="48" rx="13" fill="url(#sheen)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="35.5" cy="12.8" r="7" fill="#F7B733" opacity="0.16"/>
  <ellipse cx="24" cy="24" rx="13.5" ry="8.4" transform="rotate(-32 24 24)" stroke="url(#ring)" stroke-width="2.6"/>
  <path d="M12.4 31.6 L24 24 L30.2 18.4 L35.5 12.8" stroke="url(#ring)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="9" fill="#141520"/>
  <circle cx="24" cy="24" r="5.2" fill="url(#core)"/>
  <circle cx="12.4" cy="31.6" r="2.7" fill="#8B7CFF"/>
  <circle cx="30.2" cy="18.4" r="2.1" fill="#FBCB6E"/>
  <path d="M35.5 8.6 L37 11.3 L39.7 12.8 L37 14.3 L35.5 17 L34 14.3 L31.3 12.8 L34 11.3 Z" fill="#F7B733"/>
</svg>
